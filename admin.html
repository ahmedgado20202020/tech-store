<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إدارة المتجر | Tech Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<header class="site-header"><nav class="navbar navbar-dark container py-3"><a class="navbar-brand fw-bold" href="index.html"><span class="brand-tech">TECH</span> STORE<span class="brand-dot">.</span></a><a class="btn btn-outline-light" href="index.html">عرض المتجر</a></nav></header>
<main class="container section-pad">
  <span class="eyebrow">لوحة الإدارة المحمية</span><h1>إدارة المنتجات</h1>
  <div id="adminStatus" class="alert alert-info mt-3">سجل الدخول بحساب المدير المسجل في Supabase.</div>
  <section id="loginPanel" class="checkout-panel mt-4">
    <h4>تسجيل دخول المدير</h4>
    <div class="row g-3 mt-1">
      <div class="col-md-6"><label class="form-label">البريد الإلكتروني</label><input id="adminEmailInput" class="form-control" type="email" autocomplete="username"></div>
      <div class="col-md-6"><label class="form-label">كلمة المرور</label><input id="adminPassword" class="form-control" type="password" autocomplete="current-password"></div>
      <div class="col-12"><button id="loginBtn" class="btn btn-primary">دخول</button></div>
    </div>
  </section>
  <section id="adminPanel" class="d-none">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-4"><span>مسجل الدخول: <b id="adminEmail"></b></span><button id="logoutBtn" class="btn btn-outline-secondary">تسجيل الخروج</button></div>
    <div class="checkout-panel mt-4"><h4>إضافة منتج</h4>
      <div class="row g-3 mt-1">
        <div class="col-md-4"><label class="form-label">اسم المنتج</label><input id="pName" class="form-control"></div>
        <div class="col-md-3"><label class="form-label">القسم</label><select id="pCategory" class="form-select"></select></div>
        <div class="col-md-2"><label class="form-label">السعر بالجنيه</label><input id="pPrice" class="form-control" type="number" min="0.01" step="0.01"></div>
        <div class="col-md-3"><label class="form-label">الكمية بالمخزون</label><input id="pStock" class="form-control" type="number" min="0" value="0"></div>
        <div class="col-md-6"><label class="form-label">رابط الصورة</label><input id="pImage" class="form-control" type="url" placeholder="https://..."></div>
        <div class="col-md-6"><label class="form-label">وصف مختصر</label><input id="pDesc" class="form-control"></div>
        <div class="col-12"><button id="addProduct" class="btn btn-primary">حفظ المنتج في قاعدة البيانات</button></div>
      </div>
    </div>
    <div class="mt-5"><h4>المنتجات الحالية</h4><div id="adminProducts" class="table-responsive"></div></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/products.js"></script><script src="js/admin.js"></script>
</body></html>
