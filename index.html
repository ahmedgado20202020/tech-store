<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحليل بصمات العاملين لجميع الفروع تلقائياً</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script> 

<style>
body { font-family: 'Cairo', sans-serif; background: #f3f4f6; padding: 20px; text-align: center; }
.container { background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 0 10px rgba(0,0,0,0.1); max-width: 1200px; margin: auto; }
input[type=file], input[type=time], button { margin: 10px; padding: 10px 15px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px;}
button { background: #2563eb; color: white; cursor: pointer; border: none; font-weight: bold;}
button:hover { background: #1d4ed8; }
table { width: 100%; border-collapse: collapse; margin-top: 20px; }
th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
th { background: #2563eb; color: white; }
.info-section { background: #eff6ff; padding: 10px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #bfdbfe; color: #1e40af;}
</style>
</head>
<body>

<div class="container">
  <h2>📋 تحليل بصمات العاملين لجميع الفروع تلقائياً</h2>
  
  <div class="info-section">
    💡 بمجرد اختيار الملف والضغط على تحليل، سيقوم الكود باستخراج بيانات **كل الفروع** و حقل **اسم الفرع2 (Area Name)** الموجودة في الشيت معاً وتجميعها تلقائياً.
  </div>

  <input type="file" id="excelFile" accept=".xlsx, .xls">
  
  <br>
  <label>⏰ بداية الشفت: </label>
  <input type="time" id="shiftStart" value="07:00">
  <br>

  <button onclick="analyze()">تحليل البيانات</button>
  <button onclick="exportExcel()">⬇️ تصدير البيانات إلى Excel</button>

  <table id="resultTable">
    <thead>
      <tr>
        <th>كود الموظف</th>
        <th>الاسم</th>
        <th>اسم الفرع2</th>
        <th>Device Name</th>
        <th>التاريخ</th>
        <th>دخول</th>
        <th>خروج</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
let processedData = [];

// تنسيق التاريخ إلى DD/MM/YYYY للعرض والتصدير
function formatDateDMY(dateObj) {
  const d = new Date(dateObj);
  const day = String(d.getDate()).padStart(2, '0');
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const year = d.getFullYear();
  return `${day}/${month}/${year}`;
}

// تنسيق الوقت للعرض والتصدير ص/م
function formatTime(dateObj) {
  return new Date(dateObj).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
}

// دالة تحليل البصمات الأساسية لجميع الفروع
function analyze() {
  const fileInput = document.getElementById("excelFile");
  const shiftInput = document.getElementById("shiftStart");

  if (!fileInput.files.length) { alert("يرجى اختيار ملف Excel أولاً"); return; }
  if (!shiftInput.value) { alert("يرجى تحديد بداية الشفت"); return; }

  const shiftHour = parseInt(shiftInput.value.split(':')[0], 10);
  const shiftMinute = parseInt(shiftInput.value.split(':')[1], 10);

  const reader = new FileReader();
  reader.onload = function(e) {
    const data = new Uint8Array(e.target.result);
    const workbook = XLSX.read(data, { type: 'array' });
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(sheet);

    const records = {};

    json.forEach(row => {
      // التحقق من وجود الحقول الأساسية بالشيت
      if (!row["Employee ID"] || !row["Date"] || !row["Time"] || !row["Device Name"]) return;
      
      const empId = row["Employee ID"].toString().trim();
      const deviceName = row["Device Name"].toString().trim();
      
      // قراءة حقل Area Name ليصبح تحت مسمى branch2 (اسم الفرع2)
      const branch2 = row["Area Name"] ? row["Area Name"].toString().trim() : "غير محدد";
      
      // معالجة الاسم إذا كان فارغاً أو مكرراً بالكود
      let name = row["First Name"] ? row["First Name"].toString().trim() : "";
      if (name === "" || name === empId) {
        name = "بدون اسم"; 
      }

      // تجميع التاريخ والوقت القياسي من أعمدة الملف
      const dateTimeStr = `${row["Date"]}T${row["Time"]}`;
      const dateTime = new Date(dateTimeStr);
      if (isNaN(dateTime.getTime())) return; 

      // حساب الشفت المستهدف
      const shiftStart = new Date(dateTime);
      shiftStart.setHours(shiftHour, shiftMinute, 0, 0);
      const shiftEnd = new Date(shiftStart);
      shiftEnd.setDate(shiftEnd.getDate() + 1);

      // ترحيل البصمات المبكرة لليوم السابق إن لزم الأمر
      if (dateTime < shiftStart) {
        shiftStart.setDate(shiftStart.getDate() - 1);
        shiftEnd.setDate(shiftEnd.getDate() - 1);
      }
      const dateKey = formatDateDMY(shiftStart);

      if (!records[empId]) records[empId] = {};
      if (!records[empId][dateKey]) records[empId][dateKey] = { in: null, out: null, name, device: deviceName, b2: branch2 };

      // فلترة البصمات داخل نطاق الشفت
      if (dateTime >= shiftStart && dateTime <= shiftEnd) {
        if (!records[empId][dateKey].in || dateTime < records[empId][dateKey].in) {
          records[empId][dateKey].in = dateTime;
        }
        if (!records[empId][dateKey].out || dateTime > records[empId][dateKey].out) {
          records[empId][dateKey].out = dateTime;
        }
      }
    });

    // التأكد من أن الفارق بين الدخول والخروج لا يقل عن ساعة واحدة
    Object.keys(records).forEach(empId => {
      Object.keys(records[empId]).forEach(date => {
        const rec = records[empId][date];
        if (rec.in && rec.out) {
          const diff = (rec.out - rec.in) / (1000 * 60 * 60);
          if (diff < 1) rec.out = null; 
        }
      });
    });

    // تجميع المخرجات لجميع الفروع معاً
    let tempData = [];
    Object.keys(records).forEach(empId => {
      Object.keys(records[empId]).forEach(date => {
        const { in: inTime, out: outTime, name, device, b2 } = records[empId][date];
        if (!inTime && !outTime) return;
        tempData.push({
          empId,
          name,
          branch2: b2,
          device,
          date,
          inTime: inTime ? formatTime(inTime) : "",
          outTime: outTime ? formatTime(outTime) : ""
        });
      });
    });

    // الترتيب الأبجدي: حسب اسم الفرع2 أولاً، ثم Device Name، ثم كود الموظف، ثم التاريخ
    tempData.sort((a, b) => {
      if (a.branch2 !== b.branch2) return a.branch2.localeCompare(b.branch2);
      if (a.device !== b.device) return a.device.localeCompare(b.device);
      if (a.empId !== b.empId) return a.empId.localeCompare(b.empId, undefined, {numeric: true});
      const d1 = a.date.split('/');
      const d2 = b.date.split('/');
      return new Date(d1[2], d1[1] - 1, d1[0]) - new Date(d2[2], d2[1] - 1, d2[0]);
    });

    // عرض جميع النتائج في الجدول الموضح بالصفحة
    const tbody = document.querySelector("#resultTable tbody");
    tbody.innerHTML = "";
    tempData.forEach(row => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${row.empId}</td>
        <td>${row.name}</td>
        <td>${row.branch2}</td>
        <td>${row.device}</td>
        <td>${row.date}</td>
        <td>${row.inTime}</td>
        <td>${row.outTime}</td>
      `;
      tbody.appendChild(tr);
    });

    processedData = tempData;
    if(tempData.length === 0) {
      alert("لم يتم العثور على أي حركات دخول أو خروج في الملف.");
    } else {
      alert("تم تحليل جميع البيانات واستخراج حقل اسم الفرع2 بنجاح!");
    }
  };
  reader.readAsArrayBuffer(fileInput.files[0]);
}

// دالة تصدير البيانات الشاملة لملف إكسيل واحد يتضمن حقل اسم الفرع2
function exportExcel() {
  if (!processedData.length) { alert("لا توجد بيانات مستخرجة لتصديرها! يرجى الضغط على زر تحليل البيانات أولاً."); return; }
  const exportData = processedData.map(row => ({
    "كود الموظف": row.empId,
    "الاسم": row.name,
    "اسم الفرع2": row.branch2,
    "Device Name": row.device,
    "التاريخ": row.date,
    "دخول": row.inTime,
    "خروج": row.outTime
  }));
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(exportData);
  XLSX.utils.book_append_sheet(wb, ws, "تحليل الحضور");
  XLSX.writeFile(wb, "تحليل_بصمات_الفروع.xlsx");
}
</script>
</body>
</html>
